<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plan Producción</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: Arial; margin:20px; background:#f5f5f5; }
h1 { color:#b00000; }

.top-bar { display:flex; justify-content:space-between; align-items:center; }
.filtros { display:flex; gap:15px; }

.kpis { display:flex; flex-direction:column; gap:10px; font-weight:bold; }
.kpi-row { display:flex; gap:20px; }

.kpi {
    background:#fff;
    padding:10px 15px;
    border-radius:6px;
    box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.filtro-box { display:flex; flex-direction:column; font-size:12px; }
.comment-box { width:100%; }

/* ESTADO */
.urgente { background:#ff0000 !important; color:white !important; }
.consolidada { background:#00b4ff !important; color:white !important; }
.avance { background:#ffff00 !important; color:black !important; }
.embarque { background:#ff6a00 !important; color:white !important; }

/* TIEMPO */
.overdue { border-left:5px solid red; }
.servicio { border-left:5px solid orange; }
.entiempo { border-left:5px solid green; }

</style>
</head>

<body>

<h1>📊 Plan de Producción</h1>

<input type="file" id="upload">

<div class="top-bar">

<div class="filtros">

<select id="filtroEstado">
<option value="">Todos</option>
<option value="urgente">Urgente</option>
<option value="consolidada">Consolidada</option>
<option value="avance">MAX AVANCE</option>
<option value="embarque">MAX EMBARQUE</option>
</select>

<input type="date" id="filtroFecha">
<input type="date" id="filtroRDD">

<select id="filtroTiempo">
<option value="">Todos</option>
<option value="overdue">Overdue</option>
<option value="servicio">Servicio</option>
<option value="entiempo">En tiempo</option>
<option value="afectadas">Afectadas</option>
</select>

</div>

<div class="kpis">

<div class="kpi-row">
<div class="kpi">Total $: <span id="totalMonto">$0</span></div>
<div class="kpi">Overdue $: <span id="totalOverdue">$0</span></div>
<div class="kpi">Órdenes: <span id="totalOrders">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi">Afectadas: <span id="totalAfectadas">0</span></div>
</div>

</div>

</div>

<br>

<table id="tabla" class="display">
<thead>
<tr>
<th>Order</th>
<th>Material</th>
<th>Cantidad</th>
<th>Monto</th>
<th>Fecha</th>
<th>RDD</th>
<th>Estado</th>
<th>Afectación</th>
<th>Comentario</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  projectId: "pp-abb"
});
const db = getFirestore(app);

let tabla;
let cacheComentarios = {};
let cacheEstado = {};
let cacheAfectacion = {};

// FORMATOS
function excelToDate(v){
    if(typeof v==="number"){
        return new Date((v-25569)*86400*1000).toISOString().split("T")[0];
    }
    if(!v) return "";
    return new Date(v).toISOString().split("T")[0];
}

function money(v){
    return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v||0);
}

function calcTiempo(r){
    let hoy=new Date().toISOString().split("T")[0];
    if(r<hoy) return "overdue";
    if(r===hoy) return "servicio";
    return "entiempo";
}

// ✅ FIREBASE LEE TODO
onSnapshot(collection(db,"comentarios"), snap=>{
    snap.forEach(d=>{
        cacheComentarios[d.id]=d.data().comentario||"";
        cacheEstado[d.id]=d.data().estado||"";
        cacheAfectacion[d.id]=d.data().afectacion||"";
    });
    aplicarDatos();
});

function renderTable(data){

    let html="";

    data.forEach(r=>{

        let id=r["Order"];
        let f=excelToDate(r["Release date (actual)"]);
        let rdd=excelToDate(r["RDD"]);
        let t=calcTiempo(rdd);
        let monto=r["Monto"]||0;

        html+=`
<tr data-id="${id}" data-fecha="${f}" data-rdd="${rdd}" data-tiempo="${t}" data-monto="${monto}" class="${t}">
<td>${id}</td>
<td>${r["Material Number"]||""}</td>
<td>${r["Order quantity (GMEIN)"]||0}</td>
<td>${money(monto)}</td>
<td>${f}</td>
<td>${rdd}</td>

<td data-estado="">
<select class="estado" data-id="${id}">
<option></option>
<option value="urgente">Urgente</option>
<option value="consolidada">Consolidada</option>
<option value="avance">MAX AVANCE</option>
<option value="embarque">MAX EMBARQUE</option>
</select>
</td>

<td>
<select class="afectacion" data-id="${id}">
<option value=""></option>
<option value="MATERIAL">MATERIAL</option>
<option value="IR">IR</option>
<option value="CASO DE INGENIERIA">CASO DE INGENIERIA</option>
</select>
</td>

<td><input class="comment-box" data-id="${id}"></td>
</tr>`;
    });

    $("#tabla tbody").html(html);

    if(tabla) tabla.destroy();

    tabla=$("#tabla").DataTable({
        paging:false,
        info:false
    });

    aplicarDatos();
    calcularKPIs();
}

// ✅ APLICA TODO DESDE FIREBASE
function aplicarDatos(){

    Object.keys(cacheComentarios).forEach(id=>{
        $(`input[data-id='${id}']`).val(cacheComentarios[id]);
    });

    Object.keys(cacheEstado).forEach(id=>{
        let row=$(`tr[data-id='${id}']`);
        let sel=$(`select.estado[data-id='${id}']`);

        sel.val(cacheEstado[id]);
        row.removeClass("urgente consolidada avance embarque");

        if(cacheEstado[id]) row.addClass(cacheEstado[id]);

        row.find("td[data-estado]").attr("data-estado",cacheEstado[id]);
    });

    Object.keys(cacheAfectacion).forEach(id=>{
        $(`select.afectacion[data-id='${id}']`).val(cacheAfectacion[id]);
    });
}

// ✅ GUARDA COMENTARIO
$(document).on("change",".comment-box", async function(){

    let id=$(this).data("id");

    cacheComentarios[id]=this.value;

    await setDoc(doc(db,"comentarios",id.toString()),{
        comentario:this.value,
        estado:cacheEstado[id]||"",
        afectacion:cacheAfectacion[id]||""
    });
});

// ✅ GUARDA ESTADO
$(document).on("change",".estado", async function(){

    let id=$(this).data("id");

    cacheEstado[id]=this.value;

    await setDoc(doc(db,"comentarios",id.toString()),{
        comentario:cacheComentarios[id]||"",
        estado:this.value,
        afectacion:cacheAfectacion[id]||""
    });

    aplicarDatos();
});

// ✅ 🔥 GUARDA AFECTACION (LO NUEVO)
$(document).on("change",".afectacion", async function(){

    let id=$(this).data("id");

    cacheAfectacion[id]=this.value;

    await setDoc(doc(db,"comentarios",id.toString()),{
        comentario:cacheComentarios[id]||"",
        estado:cacheEstado[id]||"",
        afectacion:this.value
    });

    calcularKPIs();
});

// KPI
function calcularKPIs(){

    let total=0, overdue=0, c=0, afectadas=0;

    $("#tabla tbody tr").each(function(){

        if($(this).css("display")==="none") return;

        let monto=parseFloat($(this).data("monto"))||0;
        let t=$(this).data("tiempo");

        total+=monto;
        if(t==="overdue") overdue+=monto;
        c++;

        let af=$(this).find(".afectacion").val();
        if(af) afectadas++;
    });

    $("#totalMonto").text(money(total));
    $("#totalOverdue").text(money(overdue));
    $("#totalOrders").text(c);
    $("#totalAfectadas").text(afectadas);
}

// FILTROS
function aplicarFiltros(){

    let estado=$("#filtroEstado").val();
    let fecha=$("#filtroFecha").val();
    let rdd=$("#filtroRDD").val();
    let tiempo=$("#filtroTiempo").val();

    $("#tabla tbody tr").each(function(){

        let ok=true;

        let est=$(this).find("td[data-estado]").attr("data-estado");
        let f=$(this).data("fecha");
        let r=$(this).data("rdd");
        let t=$(this).data("tiempo");
        let af=$(this).find(".afectacion").val();

        if(estado && est!==estado) ok=false;
        if(fecha && f!==fecha) ok=false;
        if(rdd && r!==rdd) ok=false;

        if(tiempo==="afectadas"){
            if(!af) ok=false;
        } else {
            if(tiempo && t!==tiempo) ok=false;
        }

        $(this).toggle(ok);
    });

    calcularKPIs();
}

$("#filtroEstado,#filtroFecha,#filtroRDD,#filtroTiempo").on("change", aplicarFiltros);

// CARGA EXCEL
$("#upload").on("change",function(e){

    let reader=new FileReader();

    reader.onload=function(evt){

        let wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
        let json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

        localStorage.setItem("plan_data",JSON.stringify(json));
        renderTable(json);
    };

    reader.readAsArrayBuffer(e.target.files[0]);
});

// AUTOLOAD
window.onload=()=>{
    let s=localStorage.getItem("plan_data");
    if(s) renderTable(JSON.parse(s));
};

</script>

</body>
</html>
