<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plan Producción</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

/* BASE */
body {
    font-family: Arial;
    margin:0;
    background:#f4f5f7;
}

/* HEADER ABB */
.header {
    background: white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px; /* ✅ AGREGA ESTA LINEA */
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* ✅ AGREGA ESTO */
.header-output {
    color:#E60000;
    font-weight:bold;
    font-size:16px;
    margin-left:10px;
    border-left:2px solid #E60000;
    padding-left:10px;
}

.logo {
    font-size:32px;
    font-weight:bold;
    color:#ff0000;
}

.title {
    font-size:20px;
    font-weight:bold;
    margin-left:20px;
}

/* CONTENIDO */
.container {
    padding:20px 30px;
}

/* TARJETAS */
.card {
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* FILTROS */
.filtros {
    display:flex;
    gap:20px;
    margin-bottom:15px;
    flex-wrap:wrap;          /* ✅ evita que empuje todo */
    align-items:flex-start;
}

.filtro-box {
    display:flex;
    flex-direction:column;
    font-size:12px;
}

.filtro-box label {
    margin-bottom:5px;
    font-weight:bold;
    color:#555;
}

/* KPI */
.kpis {
    display:flex;
    gap:15px;
}

.kpi {
    background:#fff;
    padding:10px 15px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    font-weight:bold;
}

/* SOLO PINTAR PRIMERAS 3 COLUMNAS */
.urgente td:nth-child(-n+3) { 
    background:#ff0000 !important; 
    color:white; 
}

.consolidada td:nth-child(-n+3) { 
    background:#00b4ff !important; 
    color:white; 
}

.avance td:nth-child(-n+3) { 
    background:#ffff00 !important; 
}

.embarque td:nth-child(-n+3) { 
    background:#ff6a00 !important; 
    color:white; 
}

/* TABLA */
table.dataTable {
    background:white;
    border-radius:10px;
    overflow:hidden;
}

/* ===== LEYENDA DE COLORES ===== */

.legend {
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.legend-item {
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    white-space:nowrap;
}

/* círculos */
.legend-color {
    width:12px;
    height:12px;
    border-radius:50%;
}

/* colores */
.legend-urgente { background:#ff0000; }
.legend-consolidada { background:#00b4ff; }
.legend-avance { background:#ffff00; border:1px solid #aaa; }
.legend-embarque { background:#ff6a00; }

/* ===== OUTPUT HORIZONTAL ===== */
.output-box {
    display:flex;
    align-items:center;
    gap:12px;
    background:white;
    padding:8px 12px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.output-box .item {
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
}

.output-box label {
    font-weight: bold;
    color: #333;
}

.output-box input {
   width:55px;              /* un poco más ancho */
    height:28px;             /* más alto = más visible */
    text-align:center;
    border-radius:8px;
    border:2px solid #E60000; /* 🔴 rojo ABB */
    background:#fff5f5;       /* fondo suave rojo */
    font-weight:bold;
    font-size:14px;
    color:#E60000;
}

#fechaAyer {
    color:#ff0000;
    font-weight:bold;
    margin-right:10px;
}

.tabla-container {
    max-height: 500px;   /* puedes ajustar */
    overflow-y: auto;
    border-radius:10px;
}

/* ✅ ENCABEZADO FIJO */
#tabla thead th {
    position: sticky;
    top: 0;
    background: white;
    z-index: 2;
}
    
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <!-- IZQUIERDA -->
    <div style="display:flex; align-items:center; gap:15px;">
        <div class="logo">ABB</div>
        <div class="title">Plan de Producción</div>

        <!-- ✅ SOLO UNO -->
        <div id="lastUpdate" class="header-output"></div>
    </div>

    <!-- DERECHA -->
    <div class="output-box">

        <div id="fechaAyer">
        OUTPUT <span id="fechaTexto"></span>
        </div>

        <div class="item">
            <label>Almacén</label>
            <input type="number" id="outAlmacen">
        </div>

        <div class="item">
            <label>Incoming</label>
            <input type="number" id="outIncoming">
        </div>

        <div class="item">
            <label>Accesorizado</label>
            <input type="number" id="outAccesorizado">
        </div>

        <div class="item">
            <label>Interiores</label>
            <input type="number" id="outInteriores">
        </div>

    </div>

</div>

<div class="container">

<input type="file" id="upload" style="display:none;">
<button id="clearData" style="display:none;">Limpiar datos</button>
<button id="downloadExcel">Descargar Excel</button>

<br><br>

<div>

    <!-- FILTROS -->
    <div class="card">
        <div class="filtros">

          
 <!-- 1. ESTADO -->
    <div class="filtro-box">
        <label>Estado</label>
        <select id="filtroEstado">
            <option value="">Todos</option>
            <option value="urgente">Urgente</option>
            <option value="consolidada">Consolidada</option>
            <option value="avance">MAX AVANCE</option>
            <option value="embarque">MAX EMBARQUE</option>
        </select>
    </div>

    <!-- 2. FECHA -->
    <div class="filtro-box">
        <label>Fecha Programación</label>
        <input type="date" id="filtroFecha">
    </div>

    <!-- 3. ESTATUS -->
    <div class="filtro-box">
        <label>Estatus</label>
        <select id="filtroTiempo">
            <option value="">Todos</option>
            <option value="overdue">Overdue</option>
            <option value="servicio">Servicio</option>
            <option value="entiempo">En tiempo</option>
            <option value="afectadas">Afectadas</option>
        </select>
    </div>

    <!-- 4. ✅ LEYENDA (AL FINAL) -->
    <div class="filtro-box">

        <label>Estados</label>

        <div class="legend">

            <div class="legend-item">
                <div class="legend-color legend-urgente"></div>
                <span>Urgente</span>
            </div>

            <div class="legend-item">
                <div class="legend-color legend-consolidada"></div>
                <span>Consolidada</span>
            </div>

            <div class="legend-item">
                <div class="legend-color legend-avance"></div>
                <span>MAX AVANCE</span>
            </div>

            <div class="legend-item">
                <div class="legend-color legend-embarque"></div>
                <span>MAX EMBARQUE</span>
            </div>

            </div>

        </div>

    <!-- ✅ NUEVO FILTRO MULTI -->
        <div class="filtro-box">
            <label>Multi Orders</label>
            <textarea id="filtroOrdenes" 
                      placeholder="Una orden por línea"
                      style="width:180px; height:60px; resize:none;"></textarea>
        </div>

    </div> <!-- ✅ cierre de filtros -->


    <!-- KPI -->
  <div style="display:flex; justify-content:space-between; align-items:center;">

    <!-- KPI -->
    <div class="kpis">
        <div class="kpi">Total $: <span id="totalMonto">$0</span></div>
        <div class="kpi">Overdue $: <span id="totalOverdue">$0</span></div>
        <div class="kpi">Órdenes: <span id="totalOrders">0</span></div>
        <div class="kpi">Afectadas: <span id="totalAfectadas">0</span></div>
    </div>

    <!-- SEMANA -->
    <div style="display:flex; flex-direction:column; align-items:flex-end;">

        <div style="font-size:12px; color:#555; margin-bottom:3px;">
        Órdenes liberadas en la semana
        </div>

        <div id="semanaData" style="display:flex; gap:10px;"></div>

</div>

</div>

<br>

<div class="tabla-container">
    <table id="tabla" class="display">
<thead>
<tr>
<th>Sales Order</th>
<th>Item</th>
<th>Order</th>
<th>Monto</th>
<th>Fecha Prog</th>
<th>RDD</th>
<th>Estado</th>
<th>Afectación</th>
<th>Comentario</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  projectId: "pp-abb"
});

const db = getFirestore(app);

const ADMIN = true;
const PASSWORD = "835755";

$(document).ready(function(){

    if(ADMIN){
        $("#upload").show();
        $("#clearData").show();
    }

});

let cacheEstado = {};
let cacheComentarios = {};
let cacheAfectacion = {};

// UTILIDADES
function excelToDate(v){
    if(typeof v==="number"){
        return new Date((v-25569)*86400*1000).toISOString().split("T")[0];
    }
    return v || "";
}

function money(v){
    return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v||0);
}

function calcTiempo(r){
    let hoy=new Date().toISOString().split("T")[0];
    if(!r) return "";
    if(r<hoy) return "overdue";
    if(r===hoy) return "servicio";
    return "entiempo";
}

// DATA
onSnapshot(doc(db,"data_plan","plan"), (docSnap)=>{
    if(docSnap.exists()){

        let data = docSnap.data();

        renderTable(data.data);

        // ✅ MOSTRAR ÚLTIMA ACTUALIZACIÓN
        if(data.lastUpdate){

            let fecha = new Date(data.lastUpdate);

            let texto = "Última actualización: " + fecha.toLocaleString();

            document.getElementById("lastUpdate").innerHTML = texto;
        }
    }
});

// FIREBASE USER DATA
onSnapshot(collection(db,"comentarios"), snap=>{
    cacheEstado={}; cacheComentarios={}; cacheAfectacion={};

    snap.forEach(d=>{
        cacheComentarios[d.id]=d.data().comentario||"";
        cacheEstado[d.id]=d.data().estado||"";
        cacheAfectacion[d.id]=d.data().afectacion||"";
    });

    aplicarDatos();
});

// ✅ ✅ ✅ PEGA AQUÍ ↓↓↓

// OUTPUT COMPARTIDO
onSnapshot(doc(db,"output","ayer"), (docSnap)=>{

    if(docSnap.exists()){

        let d = docSnap.data();

        $("#outAlmacen").val(d.almacen || "");
        $("#outIncoming").val(d.incoming || "");
        $("#outAccesorizado").val(d.accesorizado || "");
        $("#outInteriores").val(d.interiores || "");
    }
});

// ✅ ✅ ✅ FIN


// RENDER
function renderTable(data){

    let html="";

    // ✅ CONTADOR SEMANA
let conteoSemana = {
    1:0, // lunes
    2:0, // martes
    3:0,
    4:0,
    5:0,
    6:0,
    0:0  // domingo
};

// obtener inicio de semana (lunes)
let hoy = new Date();
let inicioSemana = new Date(hoy);
inicioSemana.setDate(hoy.getDate() - ((hoy.getDay()+6)%7));
inicioSemana.setHours(0,0,0,0);

    data.forEach(r=>{
        let so = r["Sales Order"] || "";
        let item = r["Sales order item"] || "";
        let id=r["Order"];
        let monto=r["Monto"]||0;
        let fecha=excelToDate(r["Release date (actual)"]);
        let rdd=excelToDate(r["RDD"]);
        let t=calcTiempo(rdd);

// ✅ CONTAR POR SEMANA ACTUAL
if(fecha){

    let partes = fecha.split("-");
    let f = new Date(partes[0], partes[1]-1, partes[2]);

    if(!isNaN(f) && f >= inicioSemana && f <= hoy){

        let dia = f.getDay();
        conteoSemana[dia]++;
    }
}

        html+=`
<tr data-id="${id}" data-monto="${monto}" data-tiempo="${t}" data-fecha="${fecha}" class="${t}">
<td>${so}</td>
<td>${item}</td>
<td>${id}</td>
<td>${money(monto)}</td>
<td>${fecha}</td>
<td>${rdd}</td>

<td data-estado="">
<select class="estado" data-id="${id}">
<option></option>
<option value="urgente">Urgente</option>
<option value="consolidada">Consolidada</option>
<option value="avance">MAX AVANCE</option>
<option value="embarque">MAX EMBARQUE</option>
</select>
</td>

<td>
<select class="afectacion" data-id="${id}">
<option></option>
<option value="MATERIAL">MATERIAL</option>
<option value="IR">IR</option>
<option value="CASO DE INGENIERIA">CASO DE INGENIERIA</option>
</select>
</td>

<td><input class="comment-box" data-id="${id}"></td>
</tr>`;
    });

    $("#tabla tbody").html(html);

    if($.fn.DataTable.isDataTable('#tabla')){
        $('#tabla').DataTable().destroy();
    }

    $('#tabla').DataTable({
        paging:false,
        info:false
    });

    aplicarDatos();

// ✅ MOSTRAR TARJETAS SEMANA
let dias = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
let htmlSemana = "";
let totalSemana = 0;

for(let i=1;i<=6;i++){

    let valor = conteoSemana[i] || 0;
    totalSemana += valor;


htmlSemana += `
<div style="
    background:white;
    padding:8px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    font-size:12px;
    text-align:center;
    min-width:60px;
">

    <div><b>${dias[i]}</b></div>

    <input type="number"
           class="semana-input"
           value="${valor}"
           min="0"
           style="
               width:50px;
               text-align:center;
               font-size:16px;
               border-radius:6px;
               border:1px solid #ccc;
           ">

</div>
`;

}

// ✅ TARJETA TOTAL (SIN COLOR)
htmlSemana += `
<div style="
    background:white;
    padding:8px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    font-size:12px;
    text-align:center;
    min-width:70px;
">

    <div><b>Total</b></div>

    <input type="number"
           id="totalSemana"
           readonly
           style="
               width:60px;
               text-align:center;
               font-size:16px;
               border-radius:6px;
               border:2px solid #E60000;
               color:#E60000;
               font-weight:bold;
               background:#fff5f5;
           ">

</div>
`;

// ✅ PINTAR SEMANA EN PANTALLA
document.getElementById("semanaData").innerHTML = htmlSemana;

// ✅ INICIALIZAR TOTAL
setTimeout(() => {

    let total = 0;

    $(".semana-input").each(function(){
        total += parseInt($(this).val()) || 0;
    });

    $("#totalSemana").val(total);

}, 200);

}
    
// APLICAR DATA
function aplicarDatos(){

    $("#tabla tbody tr").each(function(){

        let id=$(this).data("id");

        $(this).find(".comment-box").val(cacheComentarios[id]||"");
        $(this).find(".estado").val(cacheEstado[id]||"");
        $(this).find(".afectacion").val(cacheAfectacion[id]||"");

        $(this).removeClass("urgente consolidada avance embarque");

        if(cacheEstado[id]){
            $(this).addClass(cacheEstado[id]);
        }

        $(this).find("td[data-estado]").attr("data-estado",cacheEstado[id]);

        let t=$(this).data("tiempo");
        $(this).removeClass("overdue servicio entiempo");
        if(t) $(this).addClass(t);

    });

    // ✅ ESTE ES EL CAMBIO
    calcularKPIs();
    
}

// FILTROS
function aplicarFiltros(){
    
// ✅ NUEVO MULTI FILTRO
    let texto = $("#filtroOrdenes").val().trim();
    let listaOrdenes = texto ? texto.split(/\n|,|\t/).map(x => x.trim()) : [];
    let estado=$("#filtroEstado").val();
    let tiempo=$("#filtroTiempo").val();
    let fecha=$("#filtroFecha").val();

    $("#tabla tbody tr").each(function(){

        let ok=true;

        let est=$(this).find("td[data-estado]").attr("data-estado");
        let t=$(this).data("tiempo");
        let af=$(this).find(".afectacion").val();
        let f=$(this).data("fecha");
        let orden = $(this).find("td:eq(2)").text().trim();
        let so = $(this).find("td:eq(0)").text().trim();

        if(estado && est!==estado) ok=false;
        if(fecha && f!==fecha) ok=false;

        if(tiempo==="afectadas"){
            if(!af) ok=false;
        } else {
            if(tiempo && t!==tiempo) ok=false;
        }
// ✅ FILTRO MULTI ORDEN
        if(listaOrdenes.length > 0){
        if(!listaOrdenes.includes(orden) && !listaOrdenes.includes(so)){
        ok = false;
    }
}
        $(this).toggle(ok);
    });

    calcularKPIs();
}

$("#filtroEstado,#filtroTiempo,#filtroFecha").on("change", aplicarFiltros);
    // ✅ ACTIVAR FILTRO MULTI
$("#filtroOrdenes").on("input", aplicarFiltros);

// ✅ CALCULAR TOTAL SEMANA AUTOMÁTICO
$(document).on("input", ".semana-input", function(){

    let total = 0;

    $(".semana-input").each(function(){
        total += parseInt($(this).val()) || 0;
    });

    $("#totalSemana").val(total);

});

// GUARDAR
$(document).on("change",".comment-box, .estado, .afectacion", async function(){

    let id=$(this).data("id");

    await setDoc(doc(db,"comentarios",id.toString()),{
        comentario: $(`input[data-id='${id}']`).val() || "",
        estado: $(`select.estado[data-id='${id}']`).val() || "",
        afectacion: $(`select.afectacion[data-id='${id}']`).val() || ""
    });
});


// ✅ ✅ ✅ PEGA JUSTO AQUÍ ↓↓↓

// GUARDAR OUTPUT
$("#outAlmacen, #outIncoming, #outAccesorizado, #outInteriores").on("input", async function(){

    await setDoc(doc(db,"output","ayer"),{
        almacen: $("#outAlmacen").val() || "",
        incoming: $("#outIncoming").val() || "",
        accesorizado: $("#outAccesorizado").val() || "",
        interiores: $("#outInteriores").val() || ""
    });

});

// ✅ ✅ ✅ FIN DE BLOQUE


// UPLOAD
$("#upload").on("change",function(e){

    let reader=new FileReader();

    reader.onload=async function(evt){

        let wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});
        let json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

        await setDoc(doc(db,"data_plan","plan"),{
    data: json,
    lastUpdate: new Date().toISOString()
});

    };

    reader.readAsArrayBuffer(e.target.files[0]);
});

// KPI
function calcularKPIs(){

    let total=0, overdue=0, c=0, afectadas=0;

    $("#tabla tbody tr:visible").each(function(){

        let monto=parseFloat($(this).data("monto"))||0;
        let t=$(this).data("tiempo");

        total+=monto;
        if(t==="overdue") overdue+=monto;
        c++;

        if($(this).find(".afectacion").val()) afectadas++;
    });

    $("#totalMonto").text(money(total));
    $("#totalOverdue").text(money(overdue));
    $("#totalOrders").text(c);
    $("#totalAfectadas").text(afectadas);
}

// ✅ PEGAR AQUÍ ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓

$(document).on("click","#clearData", async function(){

    // ✅ PEDIR CLAVE
    let pass = prompt("Ingresa la clave:");

    if(pass !== PASSWORD){
        alert("Clave incorrecta");
        return;
    }

    // ✅ CONFIRMACIÓN
    if(!confirm("¿Seguro que quieres limpiar comentarios y afectaciones?")){
        return;
    }

    try {

        let snap = await getDocs(collection(db,"comentarios"));

        for (const d of snap.docs){

            await setDoc(
                doc(db,"comentarios", d.id),
                {
                    comentario: "",
                    afectacion: ""
                },
                { merge: true }
            );

        }

        alert("Comentarios y afectaciones limpiados");

    } catch(e){

        console.error(e);
        alert("Error al limpiar");

    }

});

    $(document).on("click","#downloadExcel", function(){

    let dataExport = [];

    $("#tabla tbody tr:visible").each(function(){

        let row = $(this);

        dataExport.push({
            "Sales Order": row.find("td:eq(0)").text(),
            "Item": row.find("td:eq(1)").text(),
            "Order": row.find("td:eq(2)").text(),
            "Monto": row.find("td:eq(3)").text(),
            "Fecha Prog": row.find("td:eq(4)").text(),
            "RDD": row.find("td:eq(5)").text(),
            "Estado": row.find(".estado").val() || "",
            "Afectación": row.find(".afectacion").val() || "",
            "Comentario": row.find(".comment-box").val() || ""
        });

    });

    let ws = XLSX.utils.json_to_sheet(dataExport);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Datos");

    XLSX.writeFile(wb, "PlanProduccion.xlsx");

});

// OUTPUT AYER
function setAyer(){

    let hoy = new Date();

    if(hoy.getDay() === 1){
        hoy.setDate(hoy.getDate() - 2);
    } else {
        hoy.setDate(hoy.getDate() - 1);
    }

    let d = String(hoy.getDate()).padStart(2,'0');
    let m = String(hoy.getMonth()+1).padStart(2,'0');
    let y = hoy.getFullYear();

    let span = document.getElementById("fechaTexto");

    if(span){
        span.innerText = d + "/" + m + "/" + y;
    }
}

// ✅ EJECUCIÓN SEGURA
document.addEventListener("DOMContentLoaded", () => {
    setAyer();
    setTimeout(setAyer, 500); // refuerzo (clave en tu caso)
});

// ✅ ACTUALIZACIÓN AUTOMÁTICA
setInterval(setAyer, 30000);

</script>
